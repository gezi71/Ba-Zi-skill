<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="572" viewBox="0 0 1280 572" role="img" aria-labelledby="title desc"><title id="title">候选盘实际示例 / Actual candidate-chart example</title><desc id="desc">241分钟采样，年柱己卯、月柱丙子、日柱戊午不变，时柱分别为己未、庚申、辛酉；无概率含义。</desc><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203b37}.serif{font-family:Georgia,"Songti SC",serif}.muted{fill:#62736c}.tiny{font-size:15px}.small{font-size:20px}.label{font-size:18px;letter-spacing:2px}.title{font-size:44px;font-weight:600}</style><rect width="1280" height="572" rx="20" fill="#f5f1e8"/><text x="56" y="70" class="title">出生时间有范围，就保留候选</text><text x="56" y="109" font-size="27">Uncertain birth time? Keep the candidate charts.</text><text x="56" y="158" class="small muted">2000-01-01 · 13:00–17:00 · UTC+8 · 未做真太阳时校正 / No solar-time correction</text><rect x="56" y="190" width="1168" height="68" rx="10" fill="#203b37"/><text x="80" y="233" class="small" style="fill:#fff">共同四柱 / Shared pillars：己卯 · 丙子 · 戊午</text><text x="1198" y="233" text-anchor="end" class="small" style="fill:#d8e5dc">241 minute samples / 241 次采样</text><rect x="56" y="286" width="372" height="174" rx="12" fill="#e6ebe1"/><text x="80" y="324" class="label muted">CANDIDATE A</text><text x="80" y="365" font-size="29">13:00–14:59</text><text x="80" y="423" class="small">时柱 / Hour pillar</text><text x="396" y="426" text-anchor="end" class="serif" font-size="42">己未</text><rect x="454" y="286" width="372" height="174" rx="12" fill="#e6ebe1"/><text x="478" y="324" class="label muted">CANDIDATE B</text><text x="478" y="365" font-size="29">15:00–16:59</text><text x="478" y="423" class="small">时柱 / Hour pillar</text><text x="794" y="426" text-anchor="end" class="serif" font-size="42">庚申</text><rect x="852" y="286" width="372" height="174" rx="12" fill="#e6ebe1"/><text x="876" y="324" class="label muted">CANDIDATE C</text><text x="876" y="365" font-size="29">17:00</text><text x="876" y="423" class="small">时柱 / Hour pillar</text><text x="1192" y="426" text-anchor="end" class="serif" font-size="42">辛酉</text><text x="56" y="506" class="small">示例来自实际脚本输出 / Example generated by the chart engine.</text><text x="56" y="541" class="tiny muted">采样数量不是概率；不替用户选时辰 / Sample counts are not probabilities. Do not guess the birth hour.</text></svg>

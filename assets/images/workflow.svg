<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="536" viewBox="0 0 1280 536" role="img" aria-labelledby="title desc"><title id="title">排盘与解释流程 / Calculation and interpretation workflow</title><desc id="desc">输入确认、确定性排盘、证据检查、围绕问题解释；未评估条件不能被替换为已成立。</desc><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203b37}.serif{font-family:Georgia,"Songti SC",serif}.muted{fill:#62736c}.tiny{font-size:15px}.small{font-size:20px}.label{font-size:18px;letter-spacing:2px}.title{font-size:44px;font-weight:600}</style><rect width="1280" height="536" rx="20" fill="#f5f1e8"/><text x="56" y="72" class="title">从输入到解释 / From input to explanation</text><text x="56" y="108" class="small muted">每一步保留依据和未确定项 / Keep evidence and uncertainty at every step.</text><rect x="56" y="150" width="274" height="250" rx="12" fill="#e6ebe1"/><text x="78" y="185" class="label muted">01</text><text x="78" y="232" font-size="27" font-weight="600">确认输入</text><text x="78" y="263" class="small">Confirm input</text><text x="78" y="300" class="small">公历 · 时间 · 地点</text><text x="78" y="325" class="tiny muted">Date / time / location</text><text x="78" y="350" class="small">历史时区与读数口径</text><text x="78" y="375" class="tiny muted">Historical UTC offset</text><path d="M335 276h12m-5-5 5 5-5 5" fill="none" stroke="#607e72" stroke-width="2"/><rect x="354" y="150" width="274" height="250" rx="12" fill="#e6ebe1"/><text x="376" y="185" class="label muted">02</text><text x="376" y="232" font-size="27" font-weight="600">脚本排盘</text><text x="376" y="263" class="small">Calculate chart</text><text x="376" y="300" class="small">四柱 · 十神 · 藏干</text><text x="376" y="325" class="tiny muted">Pillars / relationships</text><text x="376" y="350" class="small">时间范围与候选比较</text><text x="376" y="375" class="tiny muted">Time-range candidates</text><path d="M633 276h12m-5-5 5 5-5 5" fill="none" stroke="#607e72" stroke-width="2"/><rect x="652" y="150" width="274" height="250" rx="12" fill="#e6ebe1"/><text x="674" y="185" class="label muted">03</text><text x="674" y="232" font-size="27" font-weight="600">检查证据</text><text x="674" y="263" class="small">Check evidence</text><text x="674" y="300" class="small">月令 · 根 · 三态条件</text><text x="674" y="325" class="tiny muted">Conditions / roots</text><text x="674" y="350" class="small">出处与校对状态</text><text x="674" y="375" class="tiny muted">Sources / review status</text><path d="M931 276h12m-5-5 5 5-5 5" fill="none" stroke="#607e72" stroke-width="2"/><rect x="950" y="150" width="274" height="250" rx="12" fill="#e6ebe1"/><text x="972" y="185" class="label muted">04</text><text x="972" y="232" font-size="27" font-weight="600">围绕问题解读</text><text x="972" y="263" class="small">Explain the question</text><text x="972" y="300" class="small">字段 → 规则 → 解释</text><text x="972" y="325" class="tiny muted">Fields → rules → reading</text><text x="972" y="350" class="small">保留不确定性</text><text x="972" y="375" class="tiny muted">Keep uncertainty</text><path d="M56 431H1224" stroke="#d6d9cf"/><text x="56" y="465" class="small">满足 / Met　　不满足 / Not met　　未评估 / Not assessed</text><text x="56" y="502" class="tiny muted">同见不等于成格，支组不等于合化 / Co-occurrence does not establish a pattern or transformation.</text></svg>
